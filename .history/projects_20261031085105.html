<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Sayed Elshazly — Backend Engineer</title>
  <script>
    (() => {
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark' ?
          savedTheme :
          (systemPrefersLight ? 'light' : 'dark');
      } catch {
        document.documentElement.dataset.theme = systemPrefersLight ? 'light' : 'dark';
      }
    })();
    document.documentElement.classList.add('is-loading');
    window.__pageLoadStartedAt = performance.now();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
